[pytest]
testpaths = tests

# Tests import the application modules directly (import recorder, import
# hotkey), which works because tests/conftest.py puts the repository root on
# sys.path. There is no package to install.
addopts = -ra --strict-markers

# Hardware-dependent tests skip themselves rather than failing when the device
# is missing, so the same command works locally and on a CI runner:
#
#   python -m pytest tests            everything the machine can run
#   python -m pytest tests -rs        ... and why anything was skipped
#
# A microphone is needed by tests/test_recorder.py, and an interactive desktop
# by tests/test_hotkey.py, which injects real Caps Lock keystrokes and restores
# the original state afterwards.

# Deprecations are errors.
#
# This used to name two modules - `error::DeprecationWarning:recorder` and the
# same for `hotkey` - which covered two files out of twenty and let a deprecation
# anywhere else pass in silence. The module field is also an unanchored prefix
# match, so `recorder` would have matched a `recorder_helpers` too.
#
# Global instead, which currently passes with nothing suppressed. If a dependency
# starts emitting one we cannot fix, add a narrow `default::DeprecationWarning:<mod>`
# line below with a note saying why - a specific, documented exception rather than a
# blanket that hides our own.
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
